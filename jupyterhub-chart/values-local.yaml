# Simplified values for testing against a local cluster (minikube, kind,
# Docker Desktop Kubernetes) - no TLS, no OAuth (dummy authenticator), so it
# comes up with nothing but `helm upgrade --install` and a `kubectl port-forward`.
#
# No Vertex AI wiring here: Workload Identity is a GKE-only mechanism (it
# binds a KSA to a GSA via the GKE metadata server), so there's no way to
# exercise the builtin-model path on a local cluster - this config is only
# useful for checking the Hub/chart/image come up and the UI (including the
# AI Tools launcher tiles) renders. Users can still add their own provider
# key by hand through the AI Settings UI to test chat locally.
proxy:
  https:
    enabled: false

singleuser:
  image:
    name: rickmcgeer/jupyter-ai-image
    tag: "dev"

  storage:
    capacity: 5G

  memory:
    guarantee: 512M
    limit: 2G
  cpu:
    guarantee: 0.1
    limit: 1

hub:
  config:
    JupyterHub:
      authenticator_class: dummy
    DummyAuthenticator:
      password: dev
