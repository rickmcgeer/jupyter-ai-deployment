# Run ./prepare-values.sh <env-file> to generate values.yaml from this file
# via envsubst. See setup-env.sh.sample for the variables it expects:
#
# GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET - Google OAuth app
# NAMESPACE      - Kubernetes namespace for the Hub
# HUB_URL        - public hostname the Hub is served at
# GOOGLE_CLOUD_PROJECT - GCP project the builtin Vertex AI access belongs to
# VERTEXAI_LOCATION    - Vertex AI region (e.g. "us-central1")
# JUPYTER_KSA          - Kubernetes ServiceAccount name bound to the Vertex
#                         AI GCP service account via Workload Identity (see
#                         scripts/setup-workload-identity.sh)
# GDP_API_TOKEN        - shared token between the Hub and gdp-service; must
#                         match GDP_SERVICE_API_TOKEN in gdp-service's own
#                         Deployment env (see global-data-plane-hub repo)
#
# This targets an IN-PLACE CUTOVER of the live jupyter-ai-1 release
# (cluster jupyter-ai-cluster, project civil-pattern-439416-k1, us-west2-a)
# - see the global-data-plane-hub repo for what's being replaced/dropped/kept
# and why. Not a fresh install: `helm upgrade` this over the existing
# release, don't `--install` a differently-named one.
#
# proxy.secretToken is deliberately left unset here (not regenerated) - z2jh
# looks up the existing Secret on upgrade and reuses it when omitted, so
# leaving it out avoids needing the live token in this file at all.

proxy:
  https:
    enabled: true
    hosts:
      - "$HUB_URL"
    letsencrypt:
      contactEmail: info@berkeley.edu

singleuser:
  image:
    name: rickmcgeer/jupyter-ai-image
    tag: "latest"

  # Explicit slugs matching the three profiles from the pre-migration
  # deployment (see global-data-plane-hub repo) - NOT for offering a real
  # choice going forward (all three point at the same new image), but
  # because JupyterHub persists each user's last-selected profile slug in
  # its own database (the hub-db-dir PVC) and replays it on every respawn.
  # Dropping profileList entirely broke respawning for any user who'd
  # previously picked a non-default profile: kubespawner tries to validate
  # their stored slug against an empty profile_list and hard-fails with
  # "No such profile: <slug>. Options include: " (an internal detail, not
  # something a spawning user did wrong). New users only ever see "BearBorg
  # (Custom)" (the default) - the other two only exist to keep old stored
  # selections resolvable.
  profileList:
    - slug: bearborg-original
      default: true
      display_name: BearBorg original
      description: Jupyter AI v3, Claude Code / Codex, Vertex AI Gemini builtin
    - slug: bearborg-custom
      display_name: "BearBorg (Custom)"
      description: Jupyter AI v3, Claude Code / Codex, Vertex AI Gemini builtin
    - slug: datascience-311
      display_name: Datascience 3.11
      description: Jupyter AI v3, Claude Code / Codex, Vertex AI Gemini builtin

  # Bound to the GCP service account via GKE Workload Identity (see
  # scripts/setup-workload-identity.sh) - no downloaded key file, no
  # Secret to mount or rotate. Google client libraries (litellm's Vertex AI
  # provider included) auto-discover these credentials via the GKE metadata
  # server; nothing in the image or its env needs to point at a key.
  serviceAccountName: $JUPYTER_KSA

  extraEnv:
    GOOGLE_CLOUD_PROJECT: $GOOGLE_CLOUD_PROJECT
    VERTEXAI_PROJECT: $GOOGLE_CLOUD_PROJECT
    VERTEXAI_LOCATION: $VERTEXAI_LOCATION

  storage:
    capacity: 10G

  # No initContainer needed to seed the default Jupyter AI model - unlike
  # coreshell-hub's setup, jupyter-ai-image already does this itself (see
  # its before-notebook.d hook), since it runs on every container start
  # regardless of how the container is launched.

  networkPolicy:
    enabled: true

  defaultUrl: "/lab"

  memory:
    limit: 2G
    guarantee: 100M
  cpu:
    limit: 1
    guarantee: 0.1

hub:
  # These two ConfigMaps (bearborg-static: the custom welcome page;
  # bearborg-custom-templates: home/login/spawn.html overrides) already
  # exist in-cluster from the prior deployment and aren't touched by this
  # Helm release - just referenced by name. See global-data-plane-hub repo
  # for their content if they ever need to be recreated from scratch.
  extraVolumeMounts:
    - name: bearborg-static
      mountPath: /srv/bearborg/static
    - name: bearborg-custom-templates
      mountPath: /etc/jupyterhub/custom_templates
  extraVolumes:
    - name: bearborg-static
      configMap:
        name: bearborg-static
    - name: bearborg-custom-templates
      configMap:
        name: bearborg-custom-templates

  extraConfig:
    announcement: |
      c.JupyterHub.template_vars = {
        "announcement": '''
        <div style="padding:10px; background:#e0f3ff; color:#123;">
          <b>JupyterAI is now available!</b><br>
          Open JupyterLab and click the JupyterAI icon in the sidebar to start chatting,
          or use the "AI Tools" row in the Launcher for Claude Code / Codex.
        </div>
        '''
      }
    # Serves bearborg-static's index.html at /hub/bearborg/ - carried over
    # unchanged from the live deployment.
    bearborgHandler: |
      from tornado.web import StaticFileHandler

      class BearBorgHandler(StaticFileHandler):
        def parse_url_path(self, url_path):
          if not url_path:
              return ''
          return url_path

      c.JupyterHub.extra_handlers = [
        (r"/bearborg(?:/(.*))?", BearBorgHandler, {
          "path": "/srv/bearborg/static",
          "default_filename": "index.html",
        }),
      ]
    # Registers gdp (the Global Data Plane - NOT part of this Helm release,
    # see raw-manifests/gdp-service.yaml in global-data-plane-hub) as an
    # OAuth-protected Hub service. Carried over unchanged except the token,
    # which is now templated instead of hardcoded.
    gdp-service-config: |
      c.JupyterHub.load_roles = getattr(c.JupyterHub, "load_roles", [])
      c.JupyterHub.load_roles.append(
        {
          "name": "user",
          "scopes": [
            "self",
            "access:servers",
            "access:services",
          ],
          "users": ["*"],
        }
      )
      c.JupyterHub.load_roles.append(
        {
          "name": "gdp-role",
          "scopes": [
            "access:services!service=gdp",
            "self",
            "read:users",
            "tokens",
          ],
          "services": ["gdp"],
          "users": ["*"],
        }
      )

      c.JupyterHub.services.append(
        {
          'name': 'gdp',
          'url': 'http://gdp-service.jupyter-ai.svc.cluster.local:5000',
          'api_token': '$GDP_API_TOKEN',
          'oauth_redirect_uri': 'https://$HUB_URL/services/gdp/callback',
          'oauth_no_confirm': True,
          'oauth_client_id': 'service-gdp'
        }
      )

  config:
    JupyterHub:
      authenticator_class: google
      allow_origin: "*"
      disable_check_xsrf: true
      template_paths:
        - /etc/jupyterhub/custom_templates
    GoogleOAuthenticator:
      username_claim: email
      client_id: $GOOGLE_OAUTH_CLIENT_ID
      client_secret: $GOOGLE_OAUTH_CLIENT_SECRET
      oauth_callback_url: "https://$HUB_URL/hub/oauth_callback"
      scope:
        - openid
        - email
        - profile
      hosted_domain:
        - berkeley.edu
        - mcgeer.com
        - lbl.gov
      login_service: "Berkeley"
    Authenticator:
      allow_all: true
      allow_existing_users: true
      admin_users:
        - mcgeer@berkeley.edu
        - lutz@berkeley.edu
        - awschmeder@lbl.gov

  # No hub.services entry needed for gdp - it's registered above via
  # extraConfig's gdp-service-config instead, because it needs OAuth
  # protection (api_token, oauth_redirect_uri, oauth_client_id) that the
  # simple `services.<name>.url` shorthand below doesn't support. hello
  # (smoke test) and litellm (retired proxy, see global-data-plane-hub's
  # README) both used that shorthand and are dropped along with them -
  # leaving nothing left to put here.

cull:
  enabled: true
  timeout: 3600
  every: 300
  maxAge: 14400
